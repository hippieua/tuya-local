name: EV charger
products:
  - id: 4ooiu7apnjjumn0d
    manufacturer: Feyree
    model: F-M24 portable
  - id: ebdm8ax35pgodi2s
    manufacturer: Feyree
    model: 22kW 3phase
  - id: uqmtey1qymnyzobg
    manufacturer: Feyree
    model: "4.3 11kW 3phase wallbox"
entities:
  # 2026-10-08: nameless "switch" (DP18) removed - the device has no DP18 (user request)
  # 2026-10-08: unused entities removed (balance/last charge, clear energy, live updates, charge delay/duration, temperature 2, voltage B/C, alarm set 1/2) - user request
  # 2026-10-08: "Current B/C" (DP106/DP107) removed - single-phase charger (user request)
  - entity: sensor
    class: enum
    translation_key: status
    icon: "mdi:ev-station"
    dps:
      - id: 101
        type: string
        name: sensor
        mapping:
          - dps_val: no_connet
            value: available
          - dps_val: connect
            value: plugged_in
          - dps_val: charing
            value: charging
          - dps_val: wait_rfid
            value: waiting_for_authorization
          - dps_val: finish
            value: charged
          - dps_val: wait_charing
            value: waiting
          - dps_val: error
            value: fault
      - id: 3
        type: string
        optional: true
        name: work_state
      - id: 14
        type: string
        optional: true
        name: work_mode
      - id: 23
        type: string
        optional: true
        name: version
      - id: 108
        type: string
        optional: true
        name: phase_info
  - entity: binary_sensor
    class: problem
    icon: "mdi:alert-outline"
    dps:
      - id: 10
        type: bitfield
        optional: true
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 10
        type: bitfield
        optional: true
        name: fault_code
      - id: 10
        type: bitfield
        optional: true
        name: description
        mapping:
          - dps_val: 0
            value: "Ready"
          - dps_val: 1
            value: "Under voltage protection"
          - dps_val: 2
            value: "Over voltage protection"
          - dps_val: 4
            value: "Over current protection"
          - dps_val: 8
            value: "Protective earth error"
          - dps_val: 16
            value: "Temperature is too high"
          - dps_val: 32
            value: "Control pilot line error"
          - dps_val: 64
            value: "Leak"
          - dps_val: 128
            value: "Relay socket"
          - dps_val: 256
            value: "Protective earth error 2"
          - dps_val: 512
            value: "Plug temperature is too high"
          - dps_val: 1024
            value: "PCB temperature is too high"
          - dps_val: 2048
            value: "Core temperature is too high"
          - dps_val: 4096
            value: "ESB"
          - dps_val: 8192
            value: "Socket protective earth error"
          - dps_val: 16384
            value: "Socket leakage"
          - dps_val: 32768
            value: "Socket temperature is too high"
  - entity: number
    name: Set charge current
    icon: "mdi:ev-plug-type2"
    dps:
      - id: 114
        type: integer
        name: value
        unit: A
        range:
          min: 6
          max: 16
        mapping:
          - constraint: maximum
            conditions:
              - dps_val: Max32A
                value_redirect: value_32a
              - dps_val: Max40A
                value_redirect: value_40a
              - dps_val: Max50A
                value_redirect: value_50a
                # - dps_val: Max60A
                #   value_redirect: value_60a
                # - dps_val: Max80A
                #   value_redirect: value_80a
      - id: 113
        type: string
        optional: true
        name: maximum
        mapping:
          - dps_val: Max16A
            value: 16
          - dps_val: Max32A
            value: 32
          - dps_val: Max40A
            value: 40
          - dps_val: Max50A
            value: 50
            # - dps_val: Max60A
            #   value: 60
            # - dps_val: Max80A
            #   value: 80
      - id: 113
        type: string
        optional: true
        name: minimum
        mapping:
          - dps_val: Max80A
            value: 24
          - dps_val: Max16A
            value: 6
          - dps_val: Max32A
            value: 8  # 2026-10-08: the unit returns 7 and 6 to 8
          - value: 8
      - id: 115
        type: integer
        optional: true
        name: value_32a
        range:
          min: 8
          max: 32
      - id: 116
        type: integer
        optional: true
        name: value_40a
        range:
          min: 8
          max: 40
      - id: 117
        type: integer
        optional: true
        name: value_50a
        range:
          min: 8
          max: 50
          # - id: 125
          #   type: integer
          #   optional: true
          #   name: value_60a
          #   range:
          #     min: 8
          #     max: 60
          # - id: 126
          #   type: integer
          #   optional: true
          #   name: value_80a
          #   range:
          #     min: 24
          #     max: 80
  - entity: sensor
    class: power
    dps:
      - id: 109
        type: integer
        name: sensor
        unit: kW
        class: measurement
        precision: 2
        mapping:
          - scale: 9.39  # x1.065: charger under-reads (sweep 2026-10-09)
  - entity: sensor
    class: temperature
    category: diagnostic
    dps:
      - id: 110
        type: integer
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 10
  - entity: select
    name: Charging
    icon: "mdi:ev-station"
    dps:
      - id: 124
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: CloseCharging
            value: "off"
          - dps_val: OpenCharging
            value: "on"
          - dps_val: WaitOperation
            value: on_demand
  - entity: sensor
    class: voltage
    category: diagnostic
    dps:
      - id: 102
        type: integer
        optional: true
        name: sensor
        unit: V
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    dps:
      - id: 105
        type: integer
        optional: true
        name: sensor
        unit: A
        class: measurement
        precision: 1
        mapping:
          - scale: 9.22  # x1.084: charger under-reads (sweep 2026-10-09)
  - entity: sensor
    class: energy
    dps:
      - id: 112
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 10
  - entity: sensor
    name: Charging time
    category: diagnostic
    dps:
      - id: 120
        type: string
        optional: true
        name: sensor

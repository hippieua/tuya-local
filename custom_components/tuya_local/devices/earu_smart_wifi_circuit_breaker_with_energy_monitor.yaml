name: Circuit breaker
products:
  - id: ine4hhapkgxonij1
    manufacturer: EARU
    model: SW RCB
  - id: aqktrdhlsw8q90dr
    manufacturer: Zemismart
    model: SPM01-D2TW-ZM
entities:
  # 2026-10-08: "Fuse switch" (DP16) removed - this Wi-Fi SPM01 has no relay and no DP16; current/power now from signed DP103/DP104
  - entity: sensor
    name: Total energy
    class: energy
    category: diagnostic
    dps:
      - id: 1
        type: integer
        unit: kWh
        class: total_increasing
        name: sensor
        mapping:
          - scale: 100
  - entity: sensor
    class: voltage
    category: diagnostic
    dps:
      - id: 6
        optional: true
        force: true
        type: base64
        unit: V
        class: measurement
        name: sensor
        mask: "FFFF000000000000"
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    dps:
      - id: 103
        type: integer
        optional: true
        unit: A
        name: sensor
        class: measurement
        mapping:
          - scale: 1000
  - entity: sensor
    class: power
    dps:
      - id: 104
        type: integer
        optional: true
        unit: kW
        class: measurement
        name: sensor
        mapping:
          - scale: 1000
  # --- Added 2026-10-08: datapoints seen in the Tuya app / device cache (Zemismart SPM01-D2TW-ZM, "Metering_1PN_WiFi") ---
  - entity: sensor
    name: Reverse energy
    category: diagnostic
    dps:
      - id: 23
        type: integer
        optional: true
        unit: kWh
        class: total_increasing
        name: sensor
        mapping:
          - scale: 100
  - entity: sensor
    class: frequency
    category: diagnostic
    dps:
      - id: 32
        type: integer
        optional: true
        unit: Hz
        class: measurement
        name: sensor
        mapping:
          - scale: 100
  - entity: sensor
    class: power_factor
    dps:
      - id: 50
        type: integer
        optional: true
        class: measurement
        name: sensor
        mapping:
          - scale: 100
  # Clear energy counters (DP12, as in zemismart_spm02d2tw_energymeter.yaml); type to be confirmed on the device
  - entity: button
    name: Reset energy
    class: restart
    category: config
    dps:
      - id: 12
        type: boolean
        name: button
        optional: true
